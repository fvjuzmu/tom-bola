<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom Bola</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <img src="/icons/icon.svg" id="app-icon" alt="Tom Bola">
        <input type="file" id="csvFile" accept=".csv">
        <br>
        <div class="button-group">
            <button id="exportCsvButton">CSV exportieren</button>
            <button id="optionsButton">Optionen</button>
            <button id="helpButton">Hilfe</button>
            <button id="installButton">App installieren</button>
        </div>
        <br>
        <div id="statusCounter"></div>
        <div id="collab-bar">
            <span id="collab-dot" data-state="offline">●</span>
            <span id="collab-status">Nicht verbunden</span>
            <span id="collab-myname" class="collab-name"></span>
            <div class="collab-join">
                <button id="collab-toggle">Verbinden</button>
            </div>
        </div>
        <input type="text" id="searchInput" placeholder="Suche nach ID oder Name...">
        <table id="csvTable">
            <thead>
                <tr>
                    <th class="check-col">Auswahl</th>
                    <th class="id-col">ID</th>
                    <th>Name</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <footer id="app-footer">
        <a href="https://github.com/fvjuzmu/tom-bola" target="_blank" rel="noopener">GitHub</a>
        <span id="app-version"></span>
    </footer>

    <div id="optionsModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Optionen</h2>
            <div class="option-group">
                <h3>Darstellung</h3>
                <label><input type="radio" name="theme" value="auto"> Automatisch</label>
                <label><input type="radio" name="theme" value="light"> Hell</label>
                <label><input type="radio" name="theme" value="dark"> Dunkel</label>
            </div>
            <div class="option-group">
                <h3>Ansicht</h3>
                <label><input type="checkbox" id="hideChecked"> Ausgegebene ausblenden</label>
            </div>
            <div class="option-group">
                <h3>Mitspieler</h3>
                <div id="collab-peer-list"><em>Nicht verbunden</em></div>
            </div>
        </div>
    </div>

    <div id="pairingModal" class="modal">
        <div class="modal-content pairing-modal-content">
            <span class="close-button" id="pairing-close">&times;</span>
            <div id="pairing-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script type="module" src="collab.js"></script>
</body>
</html>
